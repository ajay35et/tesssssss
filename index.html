<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">

  <meta
    name="description"
    content="Rickshaw themed music experience"
  >

  <title>रिक्शा वाला — Rickshaw Music</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- =========================
       BACKGROUND
  ========================== -->

  <div
    class="background-layer"
    id="backgroundLayer"
  ></div>

  <div class="gradient-layer"></div>

  <div class="grain"></div>


  <!-- =========================
       TOP BAR
  ========================== -->

  <header class="topbar">

    <div
      class="clock"
      id="clock"
    >
      --:--
    </div>


    <div class="highway-status">

      <span class="status-dot"></span>

      <strong id="listenerCount">
        631
      </strong>

      <span>
        on the highway
      </span>

    </div>


    <button
      class="icon-btn top-play"
      id="soundToggle"
      aria-label="Sound"
      title="Sound"
    >

      <span id="soundIcon">
        ▶
      </span>

    </button>

  </header>


  <!-- =========================
       HERO
  ========================== -->

  <main class="hero">

    <div class="brand-area">

      <h1>
        रिक्शा वाला
      </h1>


      <p
        class="tagline"
        id="tagline"
      >
        किस्मत तेजी दस्ती है, घर में मधुरा काशी है।
      </p>

    </div>


    <!-- =========================
         RICKSHAW IMAGE
    ========================== -->

    <div
      class="rickshaw-visual"
      aria-hidden="true"
    >

      <div class="road-glow"></div>

      <img
        src="rickshaw.png"
        class="rickshaw-image"
        alt=""
      >

    </div>

  </main>


  <!-- =========================
       SIDE BUTTONS
  ========================== -->

  <aside class="side-actions">


    <!-- PLAYLIST -->

    <button
      class="side-btn"
      id="playlistBtn"
      title="Playlist"
      aria-label="Playlist"
    >

      <span>
        ♫
      </span>

      <em>
        PLAYLIST
      </em>

    </button>


    <!-- SHUFFLE -->

    <button
      class="side-btn"
      id="shuffleBtn"
      title="Shuffle"
      aria-label="Shuffle"
    >

      <span>
        ⤨
      </span>

      <em>
        SHUFFLE
      </em>

    </button>


    <!-- FULLSCREEN -->

    <button
      class="side-btn"
      id="fullscreenBtn"
      title="Fullscreen"
      aria-label="Fullscreen"
    >

      <span>
        ⛶
      </span>

      <em>
        FULL
      </em>

    </button>

  </aside>


  <!-- =========================
       PLAYLIST PANEL
  ========================== -->

  <section
    class="playlist-panel"
    id="playlistPanel"
  >

    <div class="panel-head">

      <div>

        <small>
          MUSIC CONFIG
        </small>

        <h2>
          Highway Playlists
        </h2>

      </div>


      <button
        class="close-btn"
        id="closePlaylist"
        aria-label="Close"
      >
        ×
      </button>

    </div>


    <div
      class="playlist-list"
      id="playlistList"
    ></div>


    <p class="panel-note">

      Playlist IDs

      <b>
        music-config.js
      </b>

      में डालें।

    </p>

  </section>


  <!-- =========================
       MUSIC PLAYER
  ========================== -->

  <section
    class="player"
    id="player"
  >


    <!-- NOW PLAYING -->

    <div class="now-playing">

      <div class="cover-wrap">

        <img
          id="coverArt"
          src="images/default.svg"
          alt="Album art"
        >

        <div class="cover-wave"></div>

      </div>


      <div class="track-meta">

        <span class="eyebrow">
          NOW PLAYING
        </span>

        <h2 id="trackTitle">
          Highway Loading...
        </h2>

        <p id="trackArtist">
          Rickshaw Radio
        </p>

      </div>

    </div>


    <!-- =========================
         PLAYER MAIN
    ========================== -->

    <div class="player-main">


      <!-- PROGRESS -->

      <div class="progress-row">

        <span id="currentTime">
          0:00
        </span>


        <div
          class="progress-track"
          id="progressTrack"
        >

          <div
            class="progress-fill"
            id="progressFill"
          ></div>


          <div
            class="progress-knob"
            id="progressKnob"
          ></div>

        </div>


        <span id="duration">
          0:00
        </span>

      </div>


      <!-- =========================
           MUSIC CONTROLS
      ========================== -->

      <div class="controls">


        <!-- REPEAT -->

        <button
          class="control-btn small"
          id="repeatBtn"
          title="Repeat"
          aria-label="Repeat"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M17 2l4 4-4 4"></path>

            <path d="M3 11V9a3 3 0 0 1 3-3h15"></path>

            <path d="M7 22l-4-4 4-4"></path>

            <path d="M21 13v2a3 3 0 0 1-3 3H3"></path>

          </svg>

        </button>


        <!-- PREVIOUS -->

        <button
          class="control-btn"
          id="prevBtn"
          title="Previous Song"
          aria-label="Previous Song"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M6 5v14"></path>

            <path d="M19 6l-9 6 9 6z"></path>

          </svg>

        </button>


        <!-- PLAY / PAUSE -->

        <button
          class="control-btn play-main"
          id="playBtn"
          title="Play/Pause"
          aria-label="Play/Pause"
        >

          <span id="playIcon">
            ▶
          </span>

        </button>


        <!-- NEXT -->

        <button
          class="control-btn"
          id="nextBtn"
          title="Next Song"
          aria-label="Next Song"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M18 5v14"></path>

            <path d="M5 6l9 6-9 6z"></path>

          </svg>

        </button>


        <!-- MUTE -->

        <button
          class="control-btn small"
          id="muteBtn"
          title="Mute"
          aria-label="Mute"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M4 10v4h4l5 4V6l-5 4H4z"></path>

            <path d="M17 9a5 5 0 0 1 0 6"></path>

            <path d="M19.5 6.5a9 9 0 0 1 0 11"></path>

          </svg>

        </button>

      </div>

    </div>


    <!-- =========================
         VOLUME
    ========================== -->

    <div class="volume">

      <span>
        VOL
      </span>

      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        value="80"
      >

    </div>

  </section>


  <!-- =========================
       YOUTUBE PLAYER
  ========================== -->

  <div
    class="youtube-host"
    id="youtubeHost"
    aria-hidden="true"
  ></div>


  <!-- =========================
       TOAST
  ========================== -->

  <div
    class="toast"
    id="toast"
  ></div>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <span>
      RICKSHAW RADIO
    </span>

    <span>
      •
    </span>

    <span id="playlistLabel">
      RANDOM HIGHWAY MIX
    </span>

  </footer>

</div>


<!-- =========================
     CONFIG
========================== -->

<script src="music-config.js"></script>


<!-- =========================
     MAIN JS
========================== -->

<script src="app.js"></script>

</body>
</html>
