<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Rickshaw themed music experience">
  <title>टूक वाला — Rickshaw Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div class="background-layer" id="backgroundLayer"></div>
    <div class="gradient-layer"></div>
    <div class="grain"></div>

    <header class="topbar">
      <div class="clock" id="clock">--:--</div>

      <div class="highway-status">
        <span class="status-dot"></span>
        <strong id="listenerCount">631</strong>
        <span>on the highway</span>
      </div>

      <button class="icon-btn top-play" id="soundToggle" aria-label="Sound">
        <span id="soundIcon">▶</span>
      </button>
    </header>

    <main class="hero">
      <div class="brand-area">
        <div class="mini-badge">
          <span class="mini-speaker">◖</span>
          <span>
            <b>हॉर्न ओके प्लीज़</b>
            <small>Horn ok pleaseee</small>
          </span>
        </div>

        <h1>टूक वाला</h1>
        <p class="tagline" id="tagline">किस्मत तेजी दस्ती है, घर में मधुरा काशी है।</p>
      </div>

      <div class="rickshaw-visual" aria-hidden="true">
        <div class="road-glow"></div>
        <div class="rickshaw">
          <div class="rickshaw-roof"></div>
          <div class="rickshaw-cabin">
            <div class="rickshaw-window"></div>
            <div class="rickshaw-seat"></div>
          </div>
          <div class="rickshaw-front"></div>
          <div class="wheel wheel-left"></div>
          <div class="wheel wheel-right"></div>
          <div class="headlight"></div>
        </div>
      </div>
    </main>

    <aside class="side-actions">
      <button class="side-btn active" id="homeBtn" title="Home">
        <span>⌂</span><em>HOME</em>
      </button>
      <button class="side-btn" id="playlistBtn" title="Playlist">
        <span>♫</span><em>PLAYLIST</em>
      </button>
      <button class="side-btn" id="shuffleBtn" title="Shuffle">
        <span>⤨</span><em>SHUFFLE</em>
      </button>
      <button class="side-btn" id="fullscreenBtn" title="Fullscreen">
        <span>⛶</span><em>FULL</em>
      </button>
    </aside>

    <section class="playlist-panel" id="playlistPanel">
      <div class="panel-head">
        <div>
          <small>MUSIC CONFIG</small>
          <h2>Highway Playlists</h2>
        </div>
        <button class="close-btn" id="closePlaylist">×</button>
      </div>
      <div class="playlist-list" id="playlistList"></div>
      <p class="panel-note">Playlist IDs <b>music-config/playlists.js</b> में डालें।</p>
    </section>

    <section class="player" id="player">
      <div class="now-playing">
        <div class="cover-wrap">
          <img id="coverArt" src="images/default.svg" alt="Album art">
          <div class="cover-wave"></div>
        </div>
        <div class="track-meta">
          <span class="eyebrow">NOW PLAYING</span>
          <h2 id="trackTitle">Highway Loading...</h2>
          <p id="trackArtist">Rickshaw Radio</p>
        </div>
      </div>

      <div class="player-main">
        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-knob" id="progressKnob"></div>
          </div>
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button class="control-btn small" id="repeatBtn" title="Repeat">↻</button>
          <button class="control-btn" id="prevBtn" title="Previous">|◀</button>
          <button class="control-btn play-main" id="playBtn" title="Play/Pause">
            <span id="playIcon">▶</span>
          </button>
          <button class="control-btn" id="nextBtn" title="Next">▶|</button>
          <button class="control-btn small" id="muteBtn" title="Mute">◖</button>
        </div>
      </div>

      <div class="volume">
        <span>VOL</span>
        <input id="volumeSlider" type="range" min="0" max="100" value="80">
      </div>
    </section>

    <div class="youtube-host" id="youtubeHost" aria-hidden="true"></div>

    <div class="toast" id="toast"></div>

    <footer class="footer">
      <span>RICKSHAW RADIO</span>
      <span>•</span>
      <span id="playlistLabel">RANDOM HIGHWAY MIX</span>
    </footer>
  </div>

  <script src="music-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
